# Server and PostgreSQL
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:2001/craftora_db
spring.datasource.username=postgres
spring.datasource.password=craftora3d
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# CORS and image upload limits
app.cors.allowed-origins=http://localhost:4200
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=52MB

# Customer account email (configure these in the environment for verification and password reset)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${CRAFTORA_MAIL_USERNAME:}
spring.mail.password=${CRAFTORA_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${CRAFTORA_MAIL_FROM:craftora3d@gmail.com}
app.frontend-url=${CRAFTORA_FRONTEND_URL:http://localhost:4200}
